version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alimenta
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: alimenta_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://alimenta:secretpassword@db:5432/alimenta_db
      REDIS_URL: redis://redis:6379/0

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: rq worker --url $${REDIS_URL} ponderacion asignacion cleanup
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://alimenta:secretpassword@db:5432/alimenta_db
      REDIS_URL: redis://redis:6379/0

volumes:
  db_data:
