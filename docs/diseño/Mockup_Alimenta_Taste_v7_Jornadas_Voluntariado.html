/* =========================================================
   ALIMENTA — TEMA INSTITUCIONAL V3.0 (solo estilo)
   Paleta: Pantone 376 C / 187 C / 7743 C / 188 C / 425 C / 421 C
   Hereda la lógica funcional completa del mockup v2.
   ========================================================= */
:root {
  /* Colores oficiales según guía suministrada */
  --institucional: #94B43B;
  --institucional-oscuro: #466B3F;
  --rojo-institucional: #A61C31;
  --vinotinto: #76232F;
  --gris-oscuro: #565A5C;
  --gris-claro: #B1B2B0;

  /* Tokens de interfaz y compatibilidad con el mockup v2 */
  --navy: #26342A;
  --navy2: #466B3F;
  --teal: #466B3F;
  --teal2: #EBF2DC;
  --blue: #466B3F;
  --bg: #F8F9F6;
  --surface: #FFFFFF;
  --ink: #26342A;
  --muted: #565A5C;
  --line: #D9DFD3;
  --amber: #76232F;
  --amber-bg: #FBF3E3;
  --red: #A61C31;
  --red-bg: #FAE9EC;
  --shadow: 0 6px 24px rgba(38,52,42,.065);
}
body { background:var(--bg); color:var(--ink); }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible {
  outline:3px solid var(--institucional); outline-offset:3px;
}
a {color:var(--institucional-oscuro)}
a:hover {color:var(--vinotinto)}
.sidebar {
  background:linear-gradient(163deg,#263F2F 0%,#395B35 62%,#263F2F 100%);
  box-shadow:5px 0 30px rgba(38,52,42,.07);
}
.brand {margin-bottom:3px}
.brandmark { background:var(--institucional); color:#26342A; box-shadow:inset 0 0 0 1px #A6C564; }
.brandname{letter-spacing:-.75px}
.side-caption{color:#E3E9D9}
.navbtn{color:#E4EAD9; transition:background .17s,color .17s,transform .17s}
.navbtn:hover {background:rgba(148,180,59,.18);color:white;transform:translateX(2px)}
.navbtn.active {background:var(--institucional);color:#26342A;font-weight:800;box-shadow:0 4px 16px rgba(24,48,21,.14)}
.sidebar-footer {background:rgba(15,31,20,.19);color:#E3E9D9;border-color:rgba(255,255,255,.16)}
.sidebar-footer strong{color:#FFFFFF}
.topbar {background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.topbar .eyebrow {color:var(--institucional-oscuro)}
.topbar-title {color:var(--ink)}
.rolebox select {border-color:var(--line); color:var(--ink);background:#FFFFFF}
.rolecircle{background:var(--teal2);color:#35532F}
.hero {
 background:linear-gradient(116deg,#263E2D 0%,#466B3F 75%,#557846 100%);
 box-shadow:0 9px 24px rgba(50,74,43,.11);
}
.hero p{color:#F2F5EA}
.eyebrow-light{color:#DAEDA5!important}
.hero-art{border-color:rgba(255,255,255,.23);box-shadow:0 0 0 27px rgba(148,180,59,.10),0 0 0 54px rgba(148,180,59,.055)}
.sectionhead h2,h2,.card h3,.card .big{color:var(--ink)}
.card {border-color:var(--line);box-shadow:var(--shadow);transition:box-shadow .18s,border-color .18s}
.card:hover {box-shadow:0 9px 26px rgba(38,52,42,.085);border-color:#C5D4BA}
.card .kicker {color:var(--institucional-oscuro)}
.btn {background:var(--institucional-oscuro);color:white;box-shadow:0 2px 5px rgba(70,107,63,.1);transition:background .15s,transform .15s,box-shadow .15s}
.btn:hover {background:#365A30;filter:none;transform:translateY(-1px);box-shadow:0 5px 12px rgba(70,107,63,.19)}
.btn:disabled:hover {background:var(--institucional-oscuro);transform:none;box-shadow:none}
.btn.secondary {background:var(--institucional);color:#26342A;box-shadow:none}
.btn.secondary:hover {background:#A5C54D;color:#26342A}
.btn.neutral {background:#FFFFFF;color:var(--institucional-oscuro);border-color:#C9D4C4;box-shadow:none}
.btn.neutral:hover {background:#F1F5EB}
.btn.ghost {background:transparent;color:var(--institucional-oscuro);border-color:#B2C4A8;box-shadow:none}
.btn.ghost:hover {background:#EEF4E5}
.btn.danger{background:var(--rojo-institucional);color:#FFFFFF}
.btn.danger:hover{background:var(--vinotinto)}
.hero .btn.secondary {background:var(--institucional);color:#26342A}
.hero .btn.secondary:hover {background:#A5C54D}
.tag{background:#F1F3EE;color:#435344;border-color:#DDE3D8}
.tag.green {background:#EAF3DF;color:#35572F;border-color:#C9DCB3}
.tag.amber {background:#FAF1D9;color:#6C4B1A;border-color:#E8D4A8}
.tag.red {background:#FAE9EC;color:var(--vinotinto);border-color:#EBC7CF}
.tag.blue {background:#EEF0ED;color:#466B3F;border-color:#D3DAD0}
.progress{background:#E3E7E0}
.progress>div{background:linear-gradient(90deg,var(--institucional-oscuro),var(--institucional))}
.notice {background:#F0F5E7;border-color:#D4DFC8;color:#375B31}
.notice.warn{background:#FAF1D9;border-color:#E8D4A8;color:#6C4B1A}
.notice.danger{background:#FAE9EC;border-color:#EBC7CF;color:var(--vinotinto)}
.notice.ok{background:#EAF3DF;border-color:#C9DCB3;color:#35572F}
.form-group label {color:#466B3F}
.form-group input,.form-group select,.form-group textarea,.filter input,.filter select {border-color:#C9D4C4;color:var(--ink)}
.form-group input:hover,.form-group select:hover,.form-group textarea:hover,.filter input:hover,.filter select:hover {border-color:#94B43B}
.table-wrap {border-color:var(--line)}
.table th {background:#EFF3E9;color:#465B44}
.table td {border-color:#E8EDE4}
.table tr:hover td{background:#F7FAF3}
.table td strong{color:var(--ink)}
.step b {background:#EAF3DF;color:#466B3F}
.timeline {border-color:#C9D8BE}
.timeline p::before{background:var(--institucional)}
.pill {background:#EAF3DF;color:#35572F}
.poster {background:linear-gradient(120deg,#F0F5E5,#F8F9F6);border-color:#D7E3CB}
.crumb button {color:#466B3F}
.qr {background:#EAF3DF;border:1px solid #D8E6CA}
.summary-block {background:#F4F7EE}
.summary-block strong {color:var(--ink)}
.empty{border-color:#C9D4C4}
.line-item button{border-color:#EBC7CF;background:#FAE9EC;color:#76232F}
.toggle-note {color:#466B3F}
.mode-banner {background:#F5F4E8;border-color:#DBD9BC;color:#565A5C}
.toast {background:#26342A;box-shadow:0 15px 45px rgba(38,52,42,.25)}
.flowline>span{background:#F2F6EC;border-color:#D7E3CB}
.flowline>em{color:#71826B}
.window-card{background:#FAFBF8;border-color:#D9DFD3}
.footer {color:#565A5C}
@media(prefers-reduced-motion:reduce){.navbtn,.card,.btn{transition:none!important}.btn:hover,.navbtn:hover{transform:none}}

function introPublic(){return `<div class="hero"><div><div class="eyebrow-light">Alimenta · Plataforma comunitaria</div><h1>Donaciones coordinadas<br>hasta la recepción.</h1><p>Ayuda a una necesidad publicada, aporta al banco o dirige un apoyo a un edil verificado. El donante transporta y el receptor confirma; la plataforma registra.</p><div class="row" style="margin-top:20px">${btn('Explorar necesidades','go','explorar','secondary')}${btn('Donar a un edil','go','edil_directa','neutral')}</div></div><div class="hero-art">🤝</div></div>`}

 <div class="section">${head('Elige cómo aportar','En todas las rutas el traslado corresponde al donante o a un donante transportador confirmado.')}
 <div class="grid"><div class="card"><div class="qr">🧺</div><h3>Banco de donaciones</h3><p>Solicita una cita de ingreso al banco. El agente confirma el horario y verifica los productos cuando los llevas.</p>${btn('Aportar al banco','go','banco')}</div>

function explore(){
 const all=s.needs.filter(n=>n.published&&pending(n)>0);
 const shown=all.filter(n=>(!s.filterComm||n.community===s.filterComm)&&(!s.filterCat||n.cat===s.filterCat)&&(!s.filterSearch||(n.product+' '+comm(n.community)).toLowerCase().includes(s.filterSearch.toLowerCase())));
 const selected=shown.find(n=>n.id===s.previewNeed)||shown[0];

 return `${head('Necesidades comunitarias','Consulta las necesidades publicadas y abre una ficha para coordinar tu aporte.')}

 <div class="need-selector"><aside class="need-selector-rail"><div class="selector-label">EXPLORAR</div><div class="selector-stat"><span>Publicadas</span><strong>${shown.length}</strong></div><div class="selector-stat"><span>Mis aportes</span><strong>${s.donations.length}</strong></div><div class="selector-note">Cada producto conserva su saldo por separado.</div></aside><div class="need-selector-list">${shown.map(n=>`<button type="button" data-action="previewNeed" data-id="${esc(n.id)}" class="need-selector-row ${selected?.id===n.id?'is-selected':''}"><span class="demo-avatar">${esc(comm(n.community).slice(0,2).toUpperCase())}</span><span><strong>${esc(comm(n.community))}</strong><small>${esc(n.product)} · ${money(pending(n))} ${esc(n.unit)}</small></span><span class="selector-row-status">${selected?.id===n.id?'Seleccionada':'Ver'}</span></button>`).join('')||'<div class="empty">Sin resultados para estos filtros.</div>'}</div><div class="need-selector-detail">${selected?`<span class="detail-kicker">SOLICITUD ${esc(selected.id)}</span><h2>${esc(selected.product)}</h2><div class="tiny">${esc(comm(selected.community))} · ${esc(selected.cat)}</div><div class="selector-balance"><strong>${money(pending(selected))}</strong><span>${esc(selected.unit)} pendientes de confirmar</span></div><div class="progress"><div style="width:${Math.min(100,100*(selected.required-pending(selected))/selected.required)}%"></div></div><p class="tiny">${money(selected.required-pending(selected))} confirmados de ${money(selected.required)} solicitados</p><div class="demo-highlight"><strong>Próxima ventana disponible</strong><br>${next?esc(next.label):'El edil aún no publica nuevos horarios'}</div><p class="taste-detail-copy">${esc(selected.reason)}</p>${btn('Ver necesidad y aportar ↗','viewNeed',selected.id,'secondary')}`:'<div class="empty">Selecciona una necesidad para consultar su detalle.</div>'}</div></div>
 <p class="smallprint section">Datos ficticios. Los grados de necesidad son registrados por el agente y ninguna contribución se considera entregada hasta confirmar su recepción.</p>`;
}

 <div class="stack"><div class="card"><div class="qr">🎯</div><h3>Donación directa y transporte</h3><p>Selecciona una hora en una ventana publicada por el edil. <strong>Tú te encargas de transportar el aporte.</strong> La cita quedará pendiente de aceptación del receptor.</p>
 <form id="directForm"><input type="hidden" name="need" value="${esc(n.id)}"><div class="form-group"><label for="directQty">Cantidad (${esc(n.unit)})</label><input type="number" id="directQty" name="qty" min="1" max="${ap}" value="${Math.min(ap,5)||''}" required ${ap<=0?'disabled':''}></div>
 <div class="form-group" style="margin:12px 0"><label for="directSlot">Fecha y hora ofrecidas por el edil</label><select id="directSlot" name="slotKey" required ${!edil?'disabled':''}>${slotOptions('edil',n.community)}</select><div class="help">Bloques de una hora · sujeto a cupo y aceptación.</div></div>
 <div class="form-group" style="margin:12px 0"><label for="directNote">Observaciones de transporte (opcional)</label><textarea id="directNote" name="note" placeholder="Tipo de vehículo o condiciones de entrega; no incluyas datos sensibles"></textarea></div>
 <button class="btn" type="submit" ${ap<=0||!edil||!timeSlots('edil',n.community).length?'disabled':''}>Solicitar cita y comprometer aporte</button></form>${ap<=0?'<div class="notice warn">Sin saldo para nuevos compromisos.</div>':!timeSlots('edil',n.community).length?'<div class="notice warn">El edil aún no publicó horarios disponibles. No se puede agendar esta entrega.</div>':''}</div><div class="card"><h3>Etapas</h3><div class="timeline"><p>Compromiso y selección de cita.</p><p>Confirmación del edil.</p><p>Transporte por el donante.</p><p>Recepción comprobada y actualización del saldo.</p></div></div></div></div><p class="smallprint section">*El pendiente real y el aportable son diferentes. La demo no comunica direcciones exactas ni mueve productos reales.</p>`;
}

 <div class="split"><div class="card"><div class="stepper"><div class="step"><b>1</b> Solicitar cita</div><div class="step"><b>2</b> Llevar aporte</div><div class="step"><b>3</b> Verificación y almacenamiento</div></div><div class="divider"></div>
 <form id="bankForm" class="fieldset"><div class="form-group"><label for="bankProd">Producto / kit</label><select name="product" id="bankProd" required>${catalog.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>

function edilHome(){let c=myCommunity(),own=s.needs.filter(n=>n.community===c),del=s.deliveries.filter(d=>deliveryCommunity(d)===c&&d.status==='En entrega'),pendingOffers=s.deliveries.filter(d=>d.kind==='edil'&&d.recipientEdil===s.activeEdil&&d.status==='Pendiente de aceptación');return `${featuredCarousel('edil')}<div class="section"><div class="grid">${metric(own.length,'Necesidades registradas',comm(c))}${metric(del.length,'Entregas por confirmar','Solo una recepción validada cuenta')}${metric(pendingOffers.length,'Ofertas espontáneas','Aportes no vinculados a solicitudes')}</div></div><div class="section">${head('Próximas jornadas de voluntariado','Programa orientación psicológica, vacunación, atención médica u otras actividades para tu barrio.',btn('Administrar jornadas','go','jornadas_edil','secondary small'))}${volunteerPreview(myCommunity())}</div><div class="section">${head('Solicitudes','Cada producto conserva su saldo.')}${needsTable(own,true)}</div>`}

diente</label><textarea id="duplicateReason" name="duplicateReason" placeholder="Deja vacío si no hay coincidencia; si la hay, consulta Mis solicitudes o justifica por qué debe registrarse otra petición."></textarea><div class="help">Una coincidencia no se bloquea automáticamente; puedes actualizar el registro existente o justificar la excepción.</div></div><div class="form-group full"><button class="btn" type="submit">Registrar solicitud para evaluación</button><span class="help">El sistema asignará fecha, identificador y estado «Pendiente de evaluación».</span></div></form></div>`}

function receivePage(){let arr=s.deliveries.filter(d=>d.status==='En entrega'&&deliveryCommunity(d)===myCommunity());return `${head('Confirmar recepción','La cita y la salida del transportador no equivalen a la recepción efectiva.')}
 <div class="notice">Debes verificar el artículo, la cantidad y la evidencia. Si llega solo una parte, registra la cantidad real; el resto quedará como incidencia por resolver.</div>
 ${arr.length?arr.map(d=>`<div class="card" style="margin-bottom:15px"><div class="row between"><div><span class="kicker">Entrega ${esc(d.id)} · ${d.kind==='banco'?'Desde banco':d.kind==='edil'?'Aporte no solicitado':'Necesidad publicada'}</span><h3>${esc(d.product)}</h3><div class="tiny">${esc(comm(deliveryCommunity(d)))} · ${esc(scheduleLabel(d.slotKey))} · transporte del donante</div></div>${tag(d.status)}</div><div class="divider"></div>
 <form class="inlineform" data-form="receive" data-id="${esc(d.id)}"><div class="form-group"><label>Cantidad en la entrega</label><input disabled value="${money(d.qty)} ${esc(need(d.need)?.unit||st(d.product)?.unit||'unidades')}"></div><div class="form-group"><label>Cantidad recibida y apta</label><input name="qty" type="number" min="1" max="${d.qty}" value="${d.qty}" required></div><div class="form-group"><label>Código/evidencia (demo)</label><input name="proof" value="DEMO-${esc(d.id)}" required></div><button type="submit" class="btn">Confirmar recepción</button></form>
 ${d.kind==='edil'?'<div class="notice" style="margin-top:10px">Esta entrega no corresponde a una solicitud registrada. Se conserva como aporte dirigido, sin aumentar automáticamente saldos ni inventario.</div>':''}</div>`).join(''):'<div class="empty">No hay transportes en tránsito hacia esta comunidad. Revisa los aportes por aceptar o los horarios disponibles.</div>'}`}
function agentHome(){const un=s.needs.filter(n=>n.grade==null).length,critical=s.needs.filter(n=>n.grade===5&&pending(n)>0).length,bankDue=s.donations.filter(d=>d.kind==='banco'&&d.status==='Cita por validar').length;return `<div class="hero"><div><div class="eyebrow-light">Panel del agente</div><h1>Priorización humana<br>y agenda del banco.</h1><p>Califica necesidades, administra ventanas de recepción bancarias y coordina la salida del inventario con donantes transportadores y horarios publicados por ediles.</p><div class="row" style="margin-top:20px">${btn('Gestionar agenda del banco','go','agenda_banco','secondary')}${btn('Entregas del banco','go','entregas','neutral')}</div></div><div class="hero-art">⚖️</div></div><div class="section"><div class="grid">${metric(un,'Sin evaluar','Aún no tienen G')}${metric(critical,'Críticas G5','Revisión inmediata')}${metric(bankDue,'Citas bancarias por confirmar','El agente propone/valida horas')}</div></div><div class="section">${head('Cola de necesidades','El ranking no sustituye el criterio humano.')}${agentNeeds()}</div>`}
function agentNeeds(){let sorted=[...s.needs].sort((a,b)=>(b.grade===5?1:0)-(a.grade===5?1:0)||(a.grade==null?-1:1)-(b.grade==null?-1:1)||(Number(score(b))||0)-(Number(score(a))||0));return `<div class="table-wrap"><table class="table"><thead><tr><th>Necesidad</th><th>Comunidad</th><th>Afectados</th><th>Espera</th><th>Grado G</th><th>Puntuación*</th><th>Acción</th></tr></thead><tbody>${sorted.map(n=>`<tr><td><strong>${esc(n.product)}</strong><div class="tiny">${esc(n.id)} · ${money(pending(n))} pendientes</div></td><td>${esc(comm(n.community))}</td><td>${money(n.affected)}</td><td>${age(n)} días</td><td>${n.grade===5?tag('5 · Crítico'):n.grade===null?tag('Sin evaluar'):`${n.grade} / 5`}</td><td>${score(n)??'—'}</td><td>${btn('Evaluar','evaluate',n.id,'neutral small')}</td></tr>`).join('')}</tbody></table></div><p class="smallprint">*Puntaje de demostración: 50% G + 30% A + 20% T, con A normalizado entre 1 y 5 usando 150 personas como referencia y T usando 30 días. Es una normalización ilustrativa, NO una decisión del proyecto ni indicador apto para producción.</p>`}
function agentQueue(){return `${head('Bandeja de evaluación','Se califica cada producto solicitado y se conserva la justificación. G = 5 genera alerta de revisión inmediata.')}<div class="notice warn">Las necesidades críticas deben revisarse incluso cuando su puntuación calculada no encabece el listado.</div>${agentNeeds()}`}
function evaluate(n){return `<div class="crumb">${btn('← Bandeja','go','bandeja','neutral small')}</div><div class="split"><div class="card"><div class="row between"><div><span class="kicker">${esc(n.id)} · ${esc(n.request)}</span><h2 style="margin-top:10px">Evaluar ${esc(n.product)}</h2></div>${tag(state(n))}</div><p>${esc(n.reason)}</p><div class="divider"></div><div class="grid two"><div class="summary-block"><span>Comunidad</span><strong>${esc(comm(n.community))}</strong></div><div class="summary-block"><span>Personas afectadas</span><strong>${money(n.affected)}</strong></div><div class="summary-block"><span>Días de espera</span><strong>${age(n)}</strong></div><div class="summary-block"><span>Pendiente</span><strong>${money(pending(n))} ${esc(n.unit)}</strong></div></div><div class="divider"></div><form id="evaluationForm"><input type="hidden" name="need" value="${esc(n.id)}"><div class="form-group"><label for="grade">Grado de necesidad G (solo agente)</label><select id="grade" name="grade" required><option value="">Selecciona un grado</option>${['1 — Muy bajo','2 — Bajo','3 — Medio','4 — Alto','5 — Crítico'].map((x,i)=>`<option value="${i+1}" ${n.grade===i+1?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group" style="margin:15px 0"><label for="gradeReason">Justificación de la evaluación</label><textarea id="gradeReason" name="reason" minlength="12" required placeholder="Argumenta los criterios observados">${esc(n.gradeReason)}</textarea></div><button type="submit" class="btn">Guardar evaluación y justificar</button></form></div><div class="stack"><div class="card"><h3>Regla de priorización</h3><p>P = 0.50 G + 0.30 A + 0.20 T</p><div class="notice warn">A y T aún no tienen normalización validada. La puntuación mostrada en la demo es solo para explorar la interfaz.</div><p>El sistema recomienda. <strong>El agente decide</strong> qué necesidad se atiende y cuántas unidades asignar. En la demo una evaluación guardada publica automáticamente la necesidad; esta regla deberá validarse con el equipo.</p></div><div class="card"><h3>Escala de evaluación</h3><p>1: muy bajo · 2: bajo · 3: medio · 4: alto · 5: crítico.</p><p>G = 5 significa que la falta de ayuda compromete de manera inmediata salud, seguridad o subsistencia.</p></div></div></div>`}
function inventory(){let incoming=s.donations.filter(d=>d.kind==='banco'&&d.status==='En recepción');return `${head('Inventario del banco','El donante transporta al banco; solo el ingreso verificado aumenta el stock.')}<div class="table-wrap"><table class="table"><thead><tr><th>Producto</th><th>Comprometido</th><th>Recibido (hist.)</th><th>Disponible</th><th>Reservado</th><th>Despachado</th><th>Entregado (hist.)</th></tr></thead><tbody>${s.stock.map(x=>`<tr><td><strong>${esc(x.product)}</strong><div class="tiny">${esc(x.unit)}</div></td><td>${money(x.promised)}</td><td>${money(x.received)}</td><td><strong>${money(x.available)}</strong></td><td>${money(x.reserved)}</td><td>${money(x.dispatched)}</td><td>${money(x.delivered)}</td></tr>`).join('')}</tbody></table></div><p class="smallprint">Recibido y entregado son contadores históricos; no se suman con stock. Lotes, ubicación, caducidad y aptitud requieren implementación real.</p>
 <div class="section">${head('Recepciones que el donante marcó como llegadas','Se exige cita confirmada y llegada antes de verificar cantidad/aptitud.')}
 <div class="card">${incoming.length?incoming.map(d=>`<form class="inlineform" data-form="verifyBank" data-id="${esc(d.id)}" style="margin-bottom:16px"><div class="form-group"><label>Aporte ${esc(d.id)}</label><input disabled value="${esc(d.product)}"></div><div class="form-group"><label>Horario de ingreso</label><input disabled value="${esc(scheduleLabel(d.slotKey))}"></div><div class="form-group"><label>Unidades aptas</label><input name="qty" type="number" min="1" max="${d.qty}" value="${d.qty}" required></div><button class="btn" type="submit">Verificar ingreso</button></form>`).join(''):'<div class="empty">Sin ingresos marcados como llegados. Las citas pendientes se gestionan en Agenda del banco.</div>'}</div></div>`}
function assignments(){let candidates=s.needs.filter(n=>n.grade!=null&&pending(n)>n.reservedBank);return `${head('Asignación de recursos del banco','El agente reserva unidades disponibles para una necesidad, con motivo y sin exceder inventario.')}<div class="notice">Una reserva no significa despacho ni entrega. El edil debe confirmar la recepción.</div><div class="grid two">${candidates.map(n=>{let stock=st(n.product);let max=Math.min(stock?.available||0,pending(n)-n.reservedBank-n.committedDirect);return `<div class="card"><div class="row between"><div><span class="kicker">${esc(comm(n.community))}</span><h3>${esc(n.product)}</h3></div>${n.grade===5?tag('G = 5'):tag('G = '+n.grade)}</div><p>Saldo pendiente: ${money(pending(n))} ${esc(n.unit)} · En inventario: ${money(stock?.available||0)} disponibles.</p><form class="inlineform" data-form="assign" data-id="${esc(n.id)}"><div class="form-group"><label>Cantidad a reservar</label><input name="qty" type="number" min="1" max="${max}" value="${max>0?Math.min(max,5):''}" ${max>0?'required':'disabled'}></div><div class="form-group"><label>Justificación</label><input name="reason" minlength="8" placeholder="Motivo de la asignación" ${max>0?'required':'disabled'}></div><button class="btn" type="submit" ${max<=0?'disabled':''}>Reservar</button></form>${max<=0?'<div class="help">No hay unidades libres o saldo aportable para asignar en este momento.</div>':''}</div>`}).join('')||'<div class="empty">No hay necesidades evaluadas pendientes.</div>'}</div>`}
function deliveries(){return `${head('Entregas desde el banco','El agente propone horario y donante transportador; el donante acepta, el banco libera recursos y el edil verifica recepción.')}
 <div class="notice">El agente no se considera transportador. Antes de liberar mercancía: confirmar cupo del edil, aceptación del donante transportador y cantidades reservadas.</div>
 <div class="stack">${s.deliveries.filter(d=>d.kind==='banco').map(d=>{
 let n=need(d.need);return `<div class="card"><div class="row between"><div><span class="kicker">${esc(d.id)} · ${esc(comm(n?.community))}</span><h3>${esc(d.product)} · ${money(d.qty)} ${esc(n?.unit||'')}</h3><div class="tiny">Horario: ${esc(scheduleLabel(d.slotKey))} · Transportador: ${d.carrier?'Donante voluntario':'Sin asignar'}</div></div>${tag(d.status)}</div><div class="divider"></div>
 ${d.status==='Reservada'?`<form class="inlineform" data-form="scheduleBank" data-id="${esc(d.id)}"><div class="form-group"><label>Ventana publicada por el edil</label><select name="slotKey" required>${slotOptions('edil',n.community)}</select></div><div class="form-group"><label>Donante transportador</label><select name="carrier" required><option value="">Selecciona transportador</option>${s.volunteer?'<option value="DONANTE-DEMO">Donante voluntario de la demo</option>':''}</select></div><button class="btn" type="submit" ${!timeSlots('edil',n.community).length||!s.volunteer?'disabled':''}>Proponer transporte</button></form>`:''}
 ${d.status==='Transporte confirmado'?btn('Autorizar retiro desde banco','releaseBank',d.id,'secondary'):''}
 ${d.status==='Pendiente de transportador'?'<p>Esperando que el donante transportador acepte la cita.</p>':''}
 ${d.status==='Despachada'?'<p>El banco entregó los artículos al transportador. Esperando que marque inicio de traslado.</p>':''}
 ${d.status==='En entrega'?'<p>En tránsito. Esperando confirmación del edil.</p>':''}
 ${d.status==='Incidencia parcial'?'<div class="notice warn">Recepción parcial. Un responsable debe resolver o reprogramar el remanente sin duplicar inventario.</div>':''}</div>`;
 }).join('')||'<div class="empty">No hay entregas reservadas. Asigna primero existencias verificadas.</div>'}</div>
 <div class="section">${head('Otras entregas','Las donaciones directas y los aportes a ediles no consumen stock del banco.')}
 <div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Tipo</th><th>Destino</th><th>Cita</th><th>Estado</th></tr></thead><tbody>${s.deliveries.filter(d=>d.kind!=='banco').map(d=>`<tr><td>${esc(d.id)}</td><td>${d.kind==='edil'?'Aporte sin solicitud':'Necesidad'}</td><td>${esc(comm(deliveryCommunity(d)))}</td><td>${esc(scheduleLabel(d.slotKey))}</td><td>${tag(d.status)}</td></tr>`).join('')||'<tr><td colspan="5">Sin entregas.</td></tr>'}</tbody></table></div></div>`}
function adminHome(){return `${featuredCarousel('admin')}<div class="section"><div class="grid">${metric(s.ediles.filter(x=>!x.verified).length,'Verificaciones pendientes','Aprobación de ediles')}${metric(catalog.length,'Productos demo','Catálogo reducido de ejemplo')}${metric(s.audit.length,'Eventos registrados','Acciones en la sesión actual')}</div></div><div class="section">${head('Jornadas comunitarias pendientes','Revisa antes de mostrar nombre del voluntario, lugar y horario en el directorio público.',btn('Revisar jornadas','go','jornadas_admin','secondary small'))}${volunteerPreview(null,true)}</div>`}
function verifications(){return `${head('Verificación de ediles','Solo ediles autorizados aparecen en el directorio al que puede dirigirse una donación sin solicitud.')}<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Representante</th><th>Comunidad</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${s.ediles.map(x=>`<tr><td>${esc(x.id)}</td><td><strong>${esc(x.name)}</strong></td><td>${esc(comm(x.community))}</td><td>${tag(x.verified?'Aprobado':'Pendiente')}</td><td>${!x.verified?btn('Aprobar en demo','approve',x.id,'secondary small'):'<span class="tiny">Verificado</span>'}</td></tr>`).join('')}</tbody></table></div><div class="notice warn section">La validación de identidad, autoridad representativa y conflictos de interés requiere reglas reales. Los aportes se destinan a la comunidad bajo custodia del edil, no al patrimonio personal del representante.</div>`}
function catalogPage(){return `${head('Catálogo de productos','Estructura objetivo: categoría → subcategoría → producto → presentación. Los kits se descomponen en productos.')}<div class="grid two">${categories.map((c,i)=>`<div class="card"><div class="row"><div class="qr">${iconFor(c)}</div><div><span class="kicker">Categoría ${i+1}</span><h3 style="margin:3px 0">${esc(c)}</h3></div></div><p>${catalog.filter(p=>baseNeeds.some(n=>n.cat===c&&n.product===p)).map(esc).join(', ')||'Pendiente de definir subcategorías y artículos concretos.'}</p></div>`).join('')}</div><div class="notice section">«No encuentro el producto» debe originar una solicitud de incorporación al catálogo para revisión administrativa. Medicamentos y demás insumos regulados quedan fuera del MVP.</div>`}
function auditPage(){return `${head('Bitácora de auditoría','Se muestran las acciones simuladas. En producción serían eventos inmutables con actor, fecha, motivo y versión.')}<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Actor</th><th>Evento</th></tr></thead><tbody>${s.audit.map(a=>`<tr><td>${fmtDate(a.date)}</td><td><strong>${esc(a.who)}</strong></td><td>${esc(a.what)}</td></tr>`).join('')}</tbody></table></div>`}

function publishedPlaces(){return s.places.filter(p=>p.status==='Publicado'&&Number.isFinite(p.lat)&&Number.isFinite(p.lon))}
function placeDays(p){return (p.days||[]).join(' · ')}
function placeUrl(p){return `https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=16/${p.lat}/${p.lon}`}
function visibleOrganizations(){return s.recognitionsPublished?s.recognitions.map(id=>s.organizations.find(o=>o.id===id)).filter(o=>o&&o.kind==='juridica'&&o.verified&&o.consent&&o.confirmed>0).slice(0,10):[]}

// Shared editorial slide: one geometry, one selector position, per-role content.
// It deliberately has no autoplay and uses only public / role-authorized demo data.
function featuredSlides(scope){
 const orgs=visibleOrganizations().slice().sort((a,b)=>b.confirmed-a.confirmed||a.name.localeCompare(b.name));
 const company=orgs[0];
 const companySlide=(o,rank)=>({eyebrow:rank===1?'ORGANIZACIÓN PRINCIPAL · RECONOCIMIENTO':'ORGANIZACIÓN ALIADA · RECONOCIMIENTO',title:rank===1?'Gracias por abrir camino.':'Aportes que merecen ser visibles.',emphasis:o.name,description:'Reconocimiento público autorizado para una persona jurídica. Se contabilizan aportes recibidos y confirmados; no promesas ni valor monetario.',action:'Conoce cómo aportar',route:'acceso',type:'company',company:o,rank});
 if(scope==='publico')return orgs.length?orgs.map((o,i)=>companySlide(o,i+1)):[{eyebrow:'RECONOCIMIENTOS · EN REVISIÓN',title:'La gratitud también es pública.',emphasis:'Sin organizaciones publicadas',description:'El agente debe validar el ranking, los aportes confirmados y la autorización de cada organización antes de publicar su nombre.',action:'Conoce Alimenta',route:'acceso',type:'empty'}];
 const companyExtra=company?[companySlide(company,1)]:[];
 if(scope==='donante')return [
 {eyebrow:'DONANTE · DESCUBRIR',title:'Cada aporte encuentra un',emphasis:'destino claro.',description:'Selecciona una necesidad publicada, revisa su saldo y reserva una ventana de recepción ofrecida por el edil.',action:'Explorar necesidades',route:'explorar',type:'need'},
 {eyebrow:'DONANTE · BANCO',title:'Entrega productos al banco.',emphasis:'El agente coordina.',description:'Elige un horario propuesto por el banco y transporta tus recursos. El inventario aumenta solo al verificar la recepción.',action:'Programar aporte',route:'banco',type:'bank'},
 {eyebrow:'DONANTE · APOYO LIBRE',title:'Apoya directamente a',emphasis:'una comunidad.',description:'Puedes ofrecer productos a un edil verificado incluso si aún no tiene una necesidad registrada.',action:'Elegir edil',route:'edil_directa',type:'edil'},
 ...companyExtra];
 if(scope==='edil')return [
 {eyebrow:'EDIL · MI COMUNIDAD',title:'Tu comunidad decide',emphasis:'cuándo recibir.',description:'Publica ventanas de recepción para que cada donante pueda seleccionar la fecha y la hora disponible.',action:'Publicar horarios',route:'agenda_edil',type:'schedule'},
 {eyebrow:'EDIL · TRAZABILIDAD',title:'Lo recibido se',emphasis:'confirma.',description:'Revisa aportes y entregas. Solo las cantidades verificadas pasan al historial y reducen saldos pendientes.',action:'Confirmar entregas',route:'recibir',type:'receive'},
 {eyebrow:'EDIL · SERVICIOS ABIERTOS',title:'Haz visibles los',emphasis:'puntos comunitarios.',description:'Registra ollas, almuerzos y otros servicios para que administración valide su publicación en el directorio público.',action:'Gestionar puntos',route:'puntos_servicio',type:'places'},
 ...companyExtra];
 if(scope==='admin')return [
 {eyebrow:'ADMINISTRACIÓN · TERRITORIO',title:'Servicios confiables,',emphasis:'siempre localizables.',description:'Valida la información pública de ollas, almuerzos y servicios comunitarios antes de mostrarlos en el mapa.',action:'Revisar puntos',route:'puntos_servicio',type:'places'},
 {eyebrow:'ADMINISTRACIÓN · PERMISOS',title:'Cada representante',emphasis:'debe verificarse.',description:'Aprueba cuentas de ediles y conserva la trazabilidad de las autorizaciones sensibles.',action:'Verificar ediles',route:'verificaciones',type:'approval'},
 {eyebrow:'ADMINISTRACIÓN · CONTROL',title:'Un historial que',emphasis:'puede auditarse.',description:'Consulta decisiones, cambios y publicaciones. La transparencia del sistema no depende de exhibir datos privados.',action:'Abrir auditoría',route:'auditoria',type:'audit'},
 ...companyExtra];
 return [];
}
function featuredVisual(slide){
 if(slide.type==='company'){
 const org=slide.company;
 const initials=org.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
 return `<div class="feature-preview-meta"><span class="feature-verified">● ORGANIZACIÓN VERIFICADA</span><span class="feature-rank">#${String(slide.rank).padStart(2,'0')} / TOP 10</span></div>
 <div class="feature-spotlight"><div class="feature-monogram" aria-hidden="true">${esc(initials)}</div><div><span class="feature-mini-overline">AGRADECIMIENTO PÚBLICO</span><h3>${esc(org.name)}</h3><p>Gracias por contribuir a las comunidades.</p></div></div>
 <div class="feature-figure"><strong>${money(org.confirmed)}</strong><div><b>Aportes confirmados</b><span>Período ilustrativo de doce meses</span></div></div>

 }
 if(slide.type==='empty')return `<div class="feature-blank"><span class="feature-large-icon">♡</span><h3>Publicación pendiente</h3><p>Sin reconocimiento aprobado para mostrar.</p></div>`;
 const n=s.needs.find(n=>n.published&&pending(n)>0);
 const countPlaces=publishedPlaces().length;
 const windows=s.windows.filter(w=>w.type==='edil'&&w.community===myCommunity()&&w.active).length;
 const awaiting=s.deliveries.filter(d=>deliveryCommunity(d)===myCommunity()&&d.status==='En entrega').length;
 const unverified=s.ediles.filter(x=>!x.verified).length;
 const content={
  need:{label:'NECESIDAD PUBLICADA',title:n?.product||'Sin solicitudes publicadas',a:money(n?pending(n):0),unit:n?.unit||'unidades',caption:`Comunidad: ${n?comm(n.community):'Por publicar'}`,items:['Saldo visible sin datos personales','Horarios disponibles por comunidad','Recepción confirmada para actualizar']},
  bank:{label:'BANCO DE DONACIONES',title:'Ingreso programado',a:money(s.stock.reduce((a,x)=>a+x.available,0)),unit:'unidades disponibles (demo)',caption:'Verificación antes de liberar inventario',items:['El agente valida la cita','El donante lleva su aporte','El banco comprueba cantidades']},
  edil:{label:'APORTE DIRIGIDO',title:'Selecciona un edil',a:money(s.ediles.filter(e=>e.verified).length),unit:'representantes verificados',caption:'Un aporte espontáneo no crea una necesidad',items:['Elegir representante','Acordar una ventana','Confirmar recepción']},
  schedule:{label:'MI AGENDA',title:'Ventanas de recepción',a:money(windows),unit:'ventanas vigentes',caption:comm(myCommunity()),items:['Publicar fecha y cupos','Recibir solicitudes de cita','Confirmar solo lo entregado']},
  receive:{label:'SEGUIMIENTO DE ENTREGAS',title:'Recepciones en curso',a:money(awaiting),unit:'por confirmar',caption:'Las cantidades recibidas tienen evidencia',items:['Identificar al donante','Verificar cantidades','Registrar una recepción parcial']},
  places:{label:'DIRECTORIO PÚBLICO',title:'Servicios comunitarios',a:money(countPlaces),unit:'puntos publicados',caption:'Ollas, almuerzos y otros servicios',items:['Registro por representantes','Revisión administrativa','Información pública sin cuenta']},
  approval:{label:'CUENTAS Y ROLES',title:'Validación de representantes',a:money(unverified),unit:'revisiones pendientes',caption:'Autorización independiente del acceso',items:['Verificar asociación comunitaria','Aprobar con registro de cambios','Mantener permisos por rol']},
  audit:{label:'AUDITORÍA',title:'Registro de acciones',a:money(s.audit.length),unit:'eventos en la demostración',caption:'Historial de operaciones sensibles',items:['Quién actuó y cuándo','Justificación de decisiones','Sin borrar el historial']}

function serviceMapMarkup(items){const selected=items.find(p=>p.id===s.selectedPlace)||items[0];

}

function handlers(){
 document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const act=b.dataset.action,id=b.dataset.id;
 switch(act){
 case 'go':go(null,id);break;
 case 'selectPlace':s.selectedPlace=id;go(null,'mapa_publico');break;
 case 'featureSelect':{const [scope,n]=id.split('|'),list=featuredSlides(scope);if(!list.length)return;s.featuredIndex[scope]=Math.min(Math.max(0,Number(n)||0),list.length-1);render();break;}
 case 'featurePrev':{const list=featuredSlides(id);if(!list.length)return;s.featuredIndex[id]=((s.featuredIndex[id]||0)-1+list.length)%list.length;render();break;}
 case 'featureNext':{const list=featuredSlides(id);if(!list.length)return;s.featuredIndex[id]=((s.featuredIndex[id]||0)+1)%list.length;render();break;}
 case 'previewNeed':s.previewNeed=id;render();break;
 case 'clearPlaceFilters':s.placeCommunity=s.placeType=s.placeDay=s.placeSearch='';render();break;
 case 'cancelPointEdit':s.placeEdit=null;render();break;
 case 'editPoint':{const p=s.places.find(x=>x.id===id);if(!p||(s.role!=='admin'&&(s.role!=='edil'||p.community!==myCommunity())))return;s.placeEdit=id;render();break;}
 case 'publishPoint':{if(s.role!=='admin')return;const p=s.places.find(x=>x.id===id);if(!p||p.status==='Publicado')return;p.status='Publicado';p.verifiedOn=today;audit(`Validó y publicó punto comunitario ${id}`,'Administrador');render();notify('Punto publicado en el mapa público.');break;}
 case 'suspendPoint':{if(s.role!=='admin')return;const p=s.places.find(x=>x.id===id);if(!p||p.status!=='Publicado')return;p.status='Suspendido';audit(`Suspendió punto comunitario ${id}`,'Administrador');render();notify('Punto retirado del directorio público.');break;}
 case 'editVolunteer':{if(s.role!=='edil')return;const v=s.volunteerEvents.find(x=>x.id===id&&x.community===myCommunity()&&x.status!=='Cancelada');if(!v)return;s.volunteerEdit=v.id;render();window.scrollTo(0,0);break;}
 case 'discardVolunteerEdit':{if(s.role!=='edil')return;s.volunteerEdit=null;render();break;}
 case 'cancelVolunteer':{if(s.role!=='edil')return;const v=s.volunteerEvents.find(x=>x.id===id&&x.community===myCommunity()&&x.status!=='Cancelada');if(!v)return;v.status='Cancelada';v.reviewedOn=null;if(s.volunteerEdit===v.id)s.volunteerEdit=null;audit(`Canceló jornada comunitaria ${v.id}`,'Edil');render();notify('Jornada cancelada y retirada de la agenda pública.');break;}
 case 'publishVolunteer':{if(s.role!=='admin')return;const v=s.volunteerEvents.find(x=>x.id===id&&x.status==='Pendiente de revisión');if(!v)return;v.status='Publicado';v.reviewedOn=today;audit(`Revisó y publicó jornada comunitaria ${v.id}`,'Administrador');render();notify('Jornada publicada en el directorio comunitario de la demostración.');break;}
 case 'suspendVolunteer':{if(s.role!=='admin')return;const v=s.volunteerEvents.find(x=>x.id===id&&x.status!=='Cancelada');if(!v)return;v.status='Cancelada';v.reviewedOn=null;audit(`Retiró jornada comunitaria ${v.id}`,'Administrador');render();notify('Jornada retirada de la publicación pública.');break;}
 case 'unpublishRecognition':{if(s.role!=='agente')return;s.recognitionsPublished=false;audit('Retiró temporalmente anuncio de organizaciones destacadas','Agente');render();notify('Agradecimientos ocultos en la portada.');break;}
 case 'viewNeed':s.selNeed=id;go(null,'detalle');break;
 case 'viewOwn':s.selNeed=id;go(null,'detalle_edil');break;
 case 'evaluate':s.evalNeed=id;go(null,'evaluacion');break;
 case 'clearFilters':s.filterComm=s.filterCat=s.filterSearch='';render();break;
 case 'reset':s=initial();render();notify('Demostración reiniciada.');break;
 case 'addLine':{const elem=document.querySelector('#request-lines');const i=++s.lineCount;elem.insertAdjacentHTML('beforeend',lineItem(i));break;}
 case 'removeLine':{const elems=document.querySelectorAll('.line-item');if(elems.length<=1){notify('La solicitud necesita al menos un producto.');break;}document.querySelector(`[data-line="${id}"]`)?.remove();break;}
 case 'approve':{let x=edilById(id);if(!x||x.verified)return;x.verified=true;audit(`Validó ${id} para ${comm(x.community)}`,'Administrador');render();notify('Edil verificado en la simulación.');break;}
 case 'closeWindow':{let w=s.windows.find(w=>w.id===id);if(!w||!w.active)return;
 const has=s.deliveries.some(d=>d.slotKey?.startsWith(w.id+'|')&&!['Confirmada','Cancelada','Rechazada','Incidencia parcial'].includes(d.status))||s.donations.some(d=>d.kind==='banco'&&d.slotKey?.startsWith(w.id+'|')&&!['Recibida y verificada','Recepción parcial','Cancelada'].includes(d.status));
 if(has){notify('Esta ventana tiene citas activas. Reprográmalas o cancélalas antes de cerrarla.');return;}
 w.active=false;audit(`Cerró ventana ${w.id}` ,s.role==='edil'?'Edil':'Agente');render();notify('Ventana cerrada.');break;}
 case 'acceptEdilOffer':{let d=s.deliveries.find(d=>d.id===id);if(!d||d.status!=='Pendiente de aceptación'||recipientOf(d)!==s.activeEdil)return;
 d.status='Programada';let gift=s.donations.find(x=>x.id===d.donation);if(gift)gift.status='Programada';audit(`Aceptó donación y horario ${d.id}`, 'Edil');render();notify('Cita aceptada; el donante puede transportar.');break;}
 case 'rejectEdilOffer':{let d=s.deliveries.find(d=>d.id===id);if(!d||d.status!=='Pendiente de aceptación'||recipientOf(d)!==s.activeEdil)return;
 if(d.kind==='directa'){let n=need(d.need);n.committedDirect=Math.max(0,n.committedDirect-d.qty);}d.status='Rechazada';let gift=s.donations.find(x=>x.id===d.donation);if(gift)gift.status='Rechazada';audit(`Rechazó ofrecimiento ${d.id}`,'Edil');render();notify('Ofrecimiento rechazado. Cupo y cantidades liberados.');break;}
 case 'acceptBankReschedule':{let d=s.donations.find(x=>x.id===id);if(!d||d.status!=='Reprogramación propuesta')return;d.status='Cita confirmada';audit(`Donante aceptó nuevo horario ${d.id}: ${d.slotKey}`,'Donante');render();notify('Horario alternativo aceptado. Ya puedes llevar la donación al banco en la cita confirmada.');break;}
 case 'rejectBankReschedule':{let d=s.donations.find(x=>x.id===id);if(!d||d.status!=='Reprogramación propuesta')return;d.status='Cita por validar';d.slotKey=null;audit(`Donante rechazó horario alternativo ${id}; falta nueva cita`,'Donante');render();notify('Alternativa rechazada. La solicitud de cita vuelve al agente sin reservar cupo.');break;}
 case 'arrivedBank':{let d=s.donations.find(x=>x.id===id);if(!d||d.kind!=='banco'||d.status!=='Cita confirmada')return;
 d.status='En recepción';audit(`Donante marcó llegada al banco ${id}`,'Donante');render();notify('Llegada registrada. Un agente debe verificar artículos antes de sumar inventario.');break;}
 case 'acceptTransport':{let d=s.deliveries.find(x=>x.id===id);if(!d||d.kind!=='banco'||d.carrier!=='DONANTE-DEMO'||d.status!=='Pendiente de transportador')return;
 d.status='Transporte confirmado';audit(`Donante aceptó transporte ${id}`,'Donante');render();notify('Transporte aceptado. Falta la salida autorizada del banco.');break;}
 case 'releaseBank':{let d=s.deliveries.find(x=>x.id===id);if(!d||d.kind!=='banco'||d.status!=='Transporte confirmado')return;
 let stock=st(d.product);if(!stock||stock.reserved<d.qty){notify('Stock reservado insuficiente; no se autoriza retiro.');return;}
 stock.reserved-=d.qty;stock.dispatched+=d.qty;d.status='Despachada';audit(`Autorizó entrega al transportador ${id}`,'Agente');render();notify('Retiro registrado. Donante transportador debe iniciar recorrido.');break;}
 case 'startTransport':{let d=s.deliveries.find(x=>x.id===id);if(!d||d.carrier!=='DONANTE-DEMO'||(d.kind==='banco'?d.status!=='Despachada':d.status!=='Programada'))return;
 d.status='En entrega';let gift=s.donations.find(x=>x.id===d.donation);if(gift)gift.status='En transporte';audit(`Donante inició transporte de ${id}`,'Donante');render();notify('Transporte en curso. Solo el edil podrá confirmar la recepción efectiva.');break;}
 case 'cancelDonation':{let gift=s.donations.find(x=>x.id===id);if(!gift||!['Pendiente de aceptación','Programada','Cita por validar','Cita confirmada','Reprogramación propuesta'].includes(gift.status))return;
 let d=s.deliveries.find(x=>x.donation===id);if(d&&d.status==='En entrega')return;
 if(gift.kind==='directa'){let n=need(gift.need);if(n)n.committedDirect=Math.max(0,n.committedDirect-gift.qty);}
 if(gift.kind==='banco')st(gift.product).promised=Math.max(0,st(gift.product).promised-gift.qty);
 gift.status='Cancelada';if(d)d.status='Cancelada';audit(`Donante canceló donación ${id}`,'Donante');render();notify('Oferta cancelada. Se liberó el compromiso y la cita.');break;}
 case 'volunteerToggle':{
 const active=s.deliveries.some(d=>d.kind==='banco'&&d.carrier==='DONANTE-DEMO'&&['Pendiente de transportador','Transporte confirmado','Despachada','En entrega'].includes(d.status));
 if(s.volunteer&&active){notify('Tienes traslados activos. Un agente debe reasignarlos antes de retirarte.');return;}
 s.volunteer=!s.volunteer;audit(`Voluntariado de transporte: ${s.volunteer?'activo':'inactivo'}`,'Donante');render();notify(s.volunteer?'Ya puedes recibir propuestas de transporte.':'Disponibilidad desactivada.');break;}
 }

 document.addEventListener('change',e=>{

 let type=String(fd.get('type')),date=String(fd.get('date')),start=String(fd.get('start')),end=String(fd.get('end')),capacity=Number(fd.get('capacity'));
 if(!['edil','banco'].includes(type)||date<today||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:00$/.test(start)||!/^\d{2}:00$/.test(end)||hourNumber(end)<=hourNumber(start)||!Number.isInteger(capacity)||capacity<1||capacity>8){formError(form,'Usa fecha futura, horas exactas, una duración positiva y cupo 1–8.');return;}
 const community=type==='edil'?myCommunity():null,owner=type==='edil'?s.activeEdil:'AGENTE';
 if(s.windows.some(w=>w.active&&w.type===type&&w.community===community&&w.date===date&&hourNumber(start)<hourNumber(w.end)&&hourNumber(end)>hourNumber(w.start))){formError(form,'La ventana se superpone con otra activa del mismo lugar.');return;}
 let id=freshId('W',s.windows);s.windows.push({id,type,community,owner,date,start,end,capacity,active:true});audit(`Publicó ventana ${id} ${date} ${start}-${end}`,type==='edil'?'Edil':'Agente');render();notify('Ventana publicada para nuevas citas.');return;
 }
 if(form.id==='directForm'){
 let n=need(fd.get('need')),qty=Number(fd.get('qty')),slotKey=String(fd.get('slotKey')||'');
 if(!n||!n.published||!Number.isInteger(qty)||qty<1||qty>openForDirect(n)||!slotAllowed('edil',n.community,slotKey)){formError(form,'Cantidad insuficiente o horario sin cupo. Recarga y elige una cita válida.');return;}
 let edil=s.ediles.find(x=>x.verified&&x.community===n.community);if(!edil){formError(form,'No hay un edil verificado para recibir la entrega.');return;}
 n.committedDirect+=qty;let id=freshId('D',s.donations),eid=freshId('E',s.deliveries);
 s.donations.unshift({id,kind:'directa',product:n.product,qty,need:n.id,recipientEdil:edil.id,status:'Pendiente de aceptación',date:today,note:String(fd.get('note')||''),slotKey});
 s.deliveries.unshift({id:eid,kind:'directa',need:n.id,recipientEdil:edil.id,product:n.product,qty,status:'Pendiente de aceptación',donation:id,date:today,slotKey,carrier:'DONANTE-DEMO'});
 audit(`Donante solicitó ${slotKey} para aportar ${qty} a ${n.id}`,'Donante');go(null,'seguimiento');notify('Compromiso y cita solicitados. Espera aceptación del edil antes de transportar.');return;
 }
 if(form.id==='targetEdilForm'){
 let edil=edilById(String(fd.get('recipientEdil'))),product=String(fd.get('product')),qty=Number(fd.get('qty')),slotKey=String(fd.get('slotKey')||''),note=String(fd.get('note')||'').trim();
 if(!edil?.verified||!catalog.includes(product)||!Number.isInteger(qty)||qty<1||note.length<12||!slotAllowed('edil',edil.community,slotKey)){formError(form,'Comprueba edil verificado, artículo, cantidad, descripción y horario disponible.');return;}
 let id=freshId('D',s.donations),eid=freshId('E',s.deliveries);
 s.donations.unshift({id,kind:'edil',product,qty,need:null,recipientEdil:edil.id,status:'Pendiente de aceptación',date:today,note,slotKey});
 s.deliveries.unshift({id:eid,kind:'edil',recipientEdil:edil.id,need:null,product,qty,status:'Pendiente de aceptación',donation:id,date:today,slotKey,carrier:'DONANTE-DEMO'});
 audit(`Ofreció ${qty} ${product} al edil ${edil.id} sin solicitud vinculada`, 'Donante');s.targetEdil='';go(null,'seguimiento');notify('Ofrecimiento registrado. El edil debe aceptarlo antes del transporte.');return;
 }
 if(form.id==='bankForm'){
 let prod=String(fd.get('product')),qty=Number(fd.get('qty')),slotKey=String(fd.get('slotKey')||'');
 if(!catalog.includes(prod)||!Number.isInteger(qty)||qty<1||!slotAllowed('banco',null,slotKey)){formError(form,'Producto, cantidad u horario de banco inválidos.');return;}
 let id=freshId('D',s.donations);s.donations.unshift({id,kind:'banco',product:prod,qty,need:null,status:'Cita por validar',date:today,note:String(fd.get('note')||''),slotKey});
 st(prod).promised+=qty;audit(`Donante solicitó ${slotKey} para ingreso al banco ${id}`,'Donante');go(null,'seguimiento');notify('Cita solicitada. El agente debe confirmarla; no aumenta inventario.');return;
 }
 if(form.dataset.form==='confirmBankSlot'){
 let d=s.donations.find(x=>x.id===form.dataset.id),slotKey=String(fd.get('slotKey')||'');
 if(!d||d.kind!=='banco'||d.status!=='Cita por validar'||!slotAllowed('banco',null,slotKey,d.id)){formError(form,'Horario no disponible.');return;}
 let prev=d.slotKey;d.requestedSlotKey=d.requestedSlotKey||prev;d.slotKey=slotKey;d.status=(prev===slotKey)?'Cita confirmada':'Reprogramación propuesta';audit(`Agente gestionó cita de ${d.id}: ${prev||'sin cupo'} → ${slotKey}, estado ${d.status}`,'Agente');render();notify(prev===slotKey?'Cita confirmada. El donante puede trasladarse.':'Hora alternativa propuesta. Requiere aceptación del donante antes de trasladarse.');return;
 }
 if(form.id==='requestForm'){
 let affected=Number(fd.get('affected')),households=Number(fd.get('households')),reason=String(fd.get('reason')||'').trim(),cat=String(fd.get('category'));
 if(!Number.isInteger(affected)||affected<1||!Number.isInteger(households)||households<1||reason.length<12){formError(form,'Completa afectados, hogares y una justificación suficiente.');return;}
 let lines=[...form.querySelectorAll('.line-item')],products=lines.map(x=>({product:x.querySelector('select').value,qty:Number(x.querySelector('input[type="number"]').value)}));
 if(!products.length||products.some(x=>!Number.isInteger(x.qty)||x.qty<1)){formError(form,'Cada producto debe tener cantidad válida.');return;}
 let existing=products.map(x=>s.needs.find(n=>n.community===myCommunity()&&n.product===x.product&&pending(n)>0)).filter(Boolean);
 if(existing.length&&String(fd.get('duplicateReason')||'').trim().length<12){notify('Coincidencia con '+existing.map(x=>x.id).join(', ')+'. Actualiza la solicitud o justifica la excepción.');form.querySelector('#duplicateReason')?.focus();return;}
 let rid=freshId('S',s.needs.map(n=>({id:n.request})));products.forEach(x=>createNeed(x.product,x.qty,affected,households,reason,cat,rid));audit(`Registró solicitud ${rid} con ${products.length} producto(s)`,'Edil');go(null,'peticiones');notify('Solicitud creada: requiere evaluación del agente.');return;
 }
 if(form.id==='evaluationForm'){
 let n=need(fd.get('need')),grade=Number(fd.get('grade')),reason=String(fd.get('reason')||'').trim();if(!n||!Number.isInteger(grade)||grade<1||grade>5||reason.length<12){formError(form,'Elige grado 1–5 y justifica con mínimo 12 caracteres.');return;}
 n.grade=grade;n.gradeReason=reason;n.published=pending(n)>0;audit(`Evaluó ${n.id}: G=${grade}; ${reason}`,'Agente');go(null,'bandeja');notify(grade===5?'Alerta G5: revisión inmediata.':'Evaluación guardada.');return;
 }
 if(form.dataset.form==='updateNeed'){
 let n=need(form.dataset.id),req=Number(fd.get('required')),affected=Number(fd.get('affected')),reason=String(fd.get('reason')||'').trim();if(!n||n.community!==myCommunity()||!Number.isInteger(req)||req<1||req<n.deliveredBank+n.deliveredDirect+n.committedDirect+n.reservedBank||!Number.isInteger(affected)||affected<1||reason.length<12){formError(form,'Cantidad inválida o por debajo de cantidades entregadas/comprometidas. Justifica.');return;}
 let prev=n.required,prevA=n.affected;n.required=req;n.affected=affected;n.grade=null;n.gradeReason='';n.published=false;audit(`Cambió ${n.id}: cantidad ${prev}→${req}, afectados ${prevA}→${affected}. ${reason}`,'Edil');render();notify('Actualización auditada. Requiere nueva evaluación.');return;
 }
 if(form.dataset.form==='verifyBank'){
 let d=s.donations.find(x=>x.id===form.dataset.id),qty=Number(fd.get('qty'));
 if(!d||d.kind!=='banco'||d.status!=='En recepción'||!Number.isInteger(qty)||qty<1||qty>d.qty){formError(form,'Primero se requiere llegada y cantidad apta válida.');return;}
 let stock=st(d.product);stock.promised=Math.max(0,stock.promised-d.qty);stock.available+=qty;stock.received+=qty;d.status=qty===d.qty?'Recibida y verificada':'Recepción parcial';audit(`Ingreso bancario ${d.id}: ${qty}/${d.qty} unidades aptas`,'Agente');render();notify('Ingreso verificado. Las diferencias requieren incidencia; no se suman a stock.');return;
 }
 if(form.dataset.form==='assign'){
 let n=need(form.dataset.id),stock=st(n?.product),qty=Number(fd.get('qty')),reason=String(fd.get('reason')||'').trim();let max=Math.min(stock?.available||0,pending(n)-n.reservedBank-n.committedDirect);
 if(!n||n.grade==null||!Number.isInteger(qty)||qty<1||qty>max||reason.length<8){formError(form,'Reserva supera stock/saldo libre o carece de justificación.');return;}
 stock.available-=qty;stock.reserved+=qty;n.reservedBank+=qty;
 let id=freshId('E',s.deliveries);s.deliveries.unshift({id,kind:'banco',need:n.id,recipientEdil:s.ediles.find(e=>e.community===n.community&&e.verified)?.id,product:n.product,qty,status:'Reservada',date:today,carrier:null,slotKey:null});
 audit(`Reservó ${qty} ${n.unit} en ${n.id}. ${reason}`,'Agente');go(null,'entregas');notify('Reserva creada. Programa entrega con un donante transportador.');return;
 }
 if(form.dataset.form==='scheduleBank'){
 let d=s.deliveries.find(x=>x.id===form.dataset.id),slotKey=String(fd.get('slotKey')||''),carrier=String(fd.get('carrier')||'');
 if(!d||d.kind!=='banco'||d.status!=='Reservada'||!s.volunteer||carrier!=='DONANTE-DEMO'||!slotAllowed('edil',deliveryCommunity(d),slotKey)){formError(form,'Cita/transportador no disponibles.');return;}
 d.slotKey=slotKey;d.carrier=carrier;d.status='Pendiente de transportador';audit(`Agente propuso transporte ${d.id}: ${slotKey}`,'Agente');render();notify('Propuesta enviada al donante transportador para su aceptación.');return;
 }
 if(form.dataset.form==='receive'){
 let d=s.deliveries.find(x=>x.id===form.dataset.id),qty=Number(fd.get('qty')),proof=String(fd.get('proof')||'').trim();
 if(!d||d.status!=='En entrega'||!Number.isInteger(qty)||qty<1||qty>d.qty||proof.length<5||deliveryCommunity(d)!==myCommunity()){formError(form,'Entrega no habilitada para este edil o cantidad/código inválidos.');return;}
 let old=d.qty,n=need(d.need);if(n&&qty>pending(n)){formError(form,'La recepción no puede superar el saldo pendiente.');return;}
 if(d.kind==='banco'){
 n.deliveredBank+=qty;n.reservedBank=Math.max(0,n.reservedBank-qty);let stock=st(d.product);stock.dispatched=Math.max(0,stock.dispatched-qty);stock.delivered+=qty;
 } else if(d.kind==='directa'){
 n.deliveredDirect+=qty;n.committedDirect=Math.max(0,n.committedDirect-qty);
 }
 let gift=s.donations.find(x=>x.id===d.donation);if(gift)gift.status=qty===old?'Entregada y confirmada':'Recepción parcial / incidencia';
 d.qty-=qty;d.status=d.qty===0?'Confirmada':'Incidencia parcial';audit(`Edil confirmó recepción ${d.id} ${qty}/${old}; prueba ${proof}`, 'Edil');render();notify(d.qty===0?'Entrega confirmada.':'Recepción parcial registrada. El remanente requiere conciliación o nueva cita.');return;
 }
 });
}

handlers();render();
})();
